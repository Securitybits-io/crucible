---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "Spotify installation only supports Debian targets."

- name: Ensure Spotify keyring directory exists
  ansible.builtin.file:
    path: "{{ spotify_keyring_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove legacy Spotify APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ spotify_legacy_source_paths }}"
  loop_control:
    label: "{{ item }}"

- name: Remove legacy Spotify trusted keyring files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ spotify_legacy_key_paths }}"
  loop_control:
    label: "{{ item }}"

- name: Install Spotify signing key
  ansible.builtin.get_url:
    url: "{{ spotify_key_url }}"
    dest: "{{ spotify_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Spotify APT source
  ansible.builtin.copy:
    dest: "{{ spotify_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ spotify_repository_uri }}
      Suites: {{ spotify_apt_suite }}
      Components: {{ spotify_apt_components | join(' ') }}
      Signed-By: {{ spotify_key_path }}

- name: Install Spotify client
  ansible.builtin.apt:
    name: "{{ spotify_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
