---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "VS Code installation only supports Debian targets."

- name: Install Microsoft signing key
  ansible.builtin.get_url:
    url: "{{ vscode_key_url }}"
    dest: "{{ vscode_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure VS Code APT source
  ansible.builtin.copy:
    dest: "{{ vscode_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ vscode_repository_uri }}
      Suites: stable
      Components: main
      Architectures: {{ vscode_debian_architecture }}
      Signed-By: {{ vscode_key_path }}

- name: Install VS Code
  ansible.builtin.apt:
    name: "{{ vscode_package }}"
    state: present
    update_cache: true
