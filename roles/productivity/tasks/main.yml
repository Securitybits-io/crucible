---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "Productivity tooling only supports Debian targets."

- name: Install productivity packages from Debian repositories
  ansible.builtin.apt:
    name: "{{ productivity_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
