---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "Virtualization tooling only supports Debian targets."

- name: Ensure VirtualBox architecture is supported
  ansible.builtin.assert:
    that:
      - virtualization_debian_architecture == "amd64"
    fail_msg: "VirtualBox installation is currently configured only for amd64 Debian hosts."

- name: Install VirtualBox kernel module build prerequisites
  ansible.builtin.apt:
    name: "{{ virtualization_virtualbox_kernel_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: virtualization_virtualbox_kernel_prerequisites

- name: Configure VirtualBox APT repository
  block:
    - name: Install Oracle VirtualBox signing key
      ansible.builtin.get_url:
        url: "{{ virtualization_virtualbox_key_url }}"
        dest: "{{ virtualization_virtualbox_key_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Configure VirtualBox APT source
      ansible.builtin.copy:
        dest: "{{ virtualization_virtualbox_sources_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ virtualization_virtualbox_repository_uri }}
          Suites: {{ virtualization_virtualbox_apt_suite }}
          Components: contrib
          Architectures: {{ virtualization_debian_architecture }}
          Signed-By: {{ virtualization_virtualbox_key_path }}

    - name: Install VirtualBox
      ansible.builtin.apt:
        name: "{{ virtualization_virtualbox_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: virtualization_virtualbox_install

- name: Add users to VirtualBox group
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - vboxusers
    append: true
    state: present
  loop: "{{ virtualization_vbox_users }}"
  loop_control:
    label: "{{ item }}"

- name: Check VirtualBox support driver device
  ansible.builtin.stat:
    path: /dev/vboxdrv
  register: virtualization_vboxdrv_device

- name: Build and load VirtualBox kernel modules
  ansible.builtin.command:
    cmd: /sbin/vboxconfig
  register: virtualization_vboxconfig
  when: >
    virtualization_virtualbox_kernel_prerequisites.changed
    or virtualization_virtualbox_install.changed
    or not virtualization_vboxdrv_device.stat.exists
  changed_when: virtualization_vboxconfig.rc == 0
