---
hashicorp_debian_architecture: "{{ workstation_debian_architecture | default('amd64') }}"
hashicorp_key_url: https://apt.releases.hashicorp.com/gpg
hashicorp_key_path: /usr/share/keyrings/hashicorp-archive-keyring.asc
hashicorp_sources_path: /etc/apt/sources.list.d/hashicorp.sources
hashicorp_repository_uri: https://apt.releases.hashicorp.com
hashicorp_apt_suite: "{{ ansible_distribution_release }}"

hashicorp_packages:
  - terraform
  - nomad
  - vagrant
