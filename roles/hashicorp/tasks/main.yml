---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "HashiCorp tooling only supports Debian targets."

- name: Install HashiCorp signing key
  ansible.builtin.get_url:
    url: "{{ hashicorp_key_url }}"
    dest: "{{ hashicorp_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure HashiCorp APT source
  ansible.builtin.copy:
    dest: "{{ hashicorp_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ hashicorp_repository_uri }}
      Suites: {{ hashicorp_apt_suite }}
      Components: main
      Architectures: {{ hashicorp_debian_architecture }}
      Signed-By: {{ hashicorp_key_path }}

- name: Install HashiCorp packages
  ansible.builtin.apt:
    name: "{{ hashicorp_packages }}"
    state: present
    update_cache: true
