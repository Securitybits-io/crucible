---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "HashiCorp tooling only supports Debian targets."

- name: Install HashiCorp repository prerequisites
  ansible.builtin.apt:
    name: "{{ hashicorp_repository_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install HashiCorp signing key
  ansible.builtin.get_url:
    url: "{{ hashicorp_key_url }}"
    dest: "{{ hashicorp_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Read HashiCorp signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - "{{ hashicorp_key_path }}"
  register: hashicorp_key_details
  changed_when: false

- name: Verify HashiCorp signing key fingerprint
  ansible.builtin.assert:
    that:
      - hashicorp_key_fingerprint in hashicorp_key_details.stdout
    fail_msg: "HashiCorp signing key fingerprint did not match {{ hashicorp_key_fingerprint }}."

- name: Configure HashiCorp APT source
  ansible.builtin.copy:
    dest: "{{ hashicorp_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ hashicorp_repository_uri }}
      Suites: {{ hashicorp_apt_suite }}
      Components: main
      Architectures: {{ hashicorp_debian_architecture }}
      Signed-By: {{ hashicorp_key_path }}

- name: Install HashiCorp packages
  ansible.builtin.apt:
    name: "{{ hashicorp_packages }}"
    state: present
    update_cache: true
