---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "This playbook only supports Debian targets."

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate configured locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
    content: |
      LANG={{ base_locale }}
      LC_ALL={{ base_locale }}

- name: Ensure admin users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    state: present
    create_home: true
  loop: "{{ base_admin_users }}"
  loop_control:
    label: "{{ item.name }}"
