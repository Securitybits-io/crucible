---
nvidia_debian_architecture: "{{ workstation_debian_architecture | default('amd64') }}"
nvidia_pci_vendor_id: "0x10de"

nvidia_manage_debian_nonfree_sources: true
nvidia_debian_sources_path: /etc/apt/sources.list.d/debian-nvidia-non-free.sources
nvidia_debian_repository_uri: http://deb.debian.org/debian
nvidia_debian_security_repository_uri: http://deb.debian.org/debian-security
nvidia_debian_apt_suite: "{{ ansible_distribution_release }}"
nvidia_debian_apt_components:
  - contrib
  - non-free
  - non-free-firmware
nvidia_debian_keyring_path: /usr/share/keyrings/debian-archive-keyring.gpg

nvidia_driver_package_state: latest
nvidia_driver_packages:
  - "linux-headers-{{ nvidia_debian_architecture }}"
  - firmware-misc-nonfree
  - nvidia-driver
  - nvidia-settings
