---
gnome_packages:
  - gdm3
  - gnome-core
  - gnome-tweaks
  - gnome-shell-extensions
  - gnome-shell-extension-dashtodock
  - libglib2.0-bin
  - accountsservice
  - dconf-cli
  - dbus-user-session
  - keyboard-configuration
  - power-profiles-daemon

gnome_services:
  - gdm3

gnome_debloat_packages:
  - gnome-tour
  - malcontent
  - gnome-contacts
  - gnome-maps
  - gnome-clocks
  - epiphany
  - simple-scan
  - gnome-user-docs
  - yelp
  - nano
  - gnome-weather

gnome_desktop_users: "{{ base_admin_users | default([]) | map(attribute='name') | list }}"

gnome_profile_picture_users: "{{ gnome_desktop_users }}"
gnome_profile_picture_file: profile.jpg
gnome_accountsservice_icon_directory: /var/lib/AccountsService/icons
gnome_accountsservice_user_directory: /var/lib/AccountsService/users

gnome_wallpaper_file: wallpaper-yellow-tree.png
gnome_wallpaper_directory: /usr/share/backgrounds/crucible
gnome_wallpaper_path: "{{ gnome_wallpaper_directory }}/{{ gnome_wallpaper_file }}"
gnome_wallpaper_uri: "file://{{ gnome_wallpaper_path }}"

gnome_color_scheme: prefer-dark
gnome_accent_color: slate
gnome_gtk_theme: Adwaita-dark
gnome_power_profile: balanced
gnome_idle_delay_seconds: 900
gnome_idle_activation_enabled: true
gnome_clock_format: 24h
gnome_favorite_apps:
  - firefox-esr.desktop
  - org.gnome.Nautilus.desktop
  - Alacritty.desktop
  - bitwarden.desktop
  - code.desktop
  - virtualbox.desktop
  - spotify.desktop
gnome_shell_enabled_extensions:
  - dash-to-dock@micxgx.gmail.com
  - workspace-indicator@gnome-shell-extensions.gcampax.github.com
  - openbar@neuromorph
  - spotify-controls@Sonath21
  - tilingshell@ferrarodomenico.com

gnome_shell_extension_cache_directory: .cache/crucible/gnome-shell-extensions
gnome_shell_extension_directory: .local/share/gnome-shell/extensions
gnome_shell_extension_sources:
  - name: Open Bar
    uuid: openbar@neuromorph
    install_method: archive
    archive_url: https://extensions.gnome.org/download-extension/openbar@neuromorph.shell-extension.zip?version_tag=65598
    required_file: extension.js
  - name: Spotify Controls + Track Info
    uuid: spotify-controls@Sonath21
    repo: https://github.com/Sonath21/spotify-controls.git
    version: HEAD
    source_subdirectory: ""
  - name: Tiling Shell
    uuid: tilingshell@ferrarodomenico.com
    install_method: archive
    archive_url: https://github.com/domferr/tilingshell/releases/latest/download/tilingshell@ferrarodomenico.com.zip
    required_file: extension.js

gnome_openbar_bar_type: Mainland
gnome_openbar_border_radius: 0.0
gnome_openbar_neon: false
gnome_openbar_border_color:
  - "0"
  - "0"
  - "0"

gnome_spotify_controls_indicator_position: middle-right
gnome_workspace_indicator_embed_previews: false
gnome_tilingshell_inner_gaps: 0
gnome_tilingshell_outer_gaps: 0

gnome_dash_to_dock_position: LEFT
gnome_dash_to_dock_height_fraction: 0.55
gnome_dash_to_dock_intellihide: true
gnome_dash_to_dock_intellihide_mode: ALL_WINDOWS
gnome_dash_to_dock_apply_custom_theme: false

gnome_keyboard_model: pc105
gnome_keyboard_layout: se
gnome_keyboard_variant: ""
gnome_keyboard_options: ""

gnome_dconf_settings:
  - key: /org/gnome/desktop/background/picture-uri
    value: "'{{ gnome_wallpaper_uri }}'"
  - key: /org/gnome/desktop/background/picture-uri-dark
    value: "'{{ gnome_wallpaper_uri }}'"
  - key: /org/gnome/desktop/background/picture-options
    value: "'zoom'"
  - key: /org/gnome/desktop/screensaver/picture-uri
    value: "'{{ gnome_wallpaper_uri }}'"
  - key: /org/gnome/desktop/screensaver/idle-activation-enabled
    value: "{{ gnome_idle_activation_enabled | lower }}"
  - key: /org/gnome/desktop/interface/color-scheme
    value: "'{{ gnome_color_scheme }}'"
  - key: /org/gnome/desktop/interface/accent-color
    value: "'{{ gnome_accent_color }}'"
  - key: /org/gnome/desktop/interface/gtk-theme
    value: "'{{ gnome_gtk_theme }}'"
  - key: /org/gnome/desktop/interface/clock-format
    value: "'{{ gnome_clock_format }}'"
  - key: /org/gnome/desktop/session/idle-delay
    value: "uint32 {{ gnome_idle_delay_seconds }}"
  - key: /org/gnome/desktop/input-sources/sources
    value: "[('xkb', '{{ gnome_keyboard_layout }}')]"
  - key: /org/gnome/shell/enabled-extensions
    value: "{{ gnome_shell_enabled_extensions | string }}"
  - key: /org/gnome/shell/favorite-apps
    value: "{{ gnome_favorite_apps | string }}"
  - key: /org/gnome/shell/extensions/dash-to-dock/intellihide
    value: "{{ gnome_dash_to_dock_intellihide | lower }}"
  - key: /org/gnome/shell/extensions/dash-to-dock/intellihide-mode
    value: "'{{ gnome_dash_to_dock_intellihide_mode }}'"
  - key: /org/gnome/shell/extensions/dash-to-dock/dock-position
    value: "'{{ gnome_dash_to_dock_position }}'"
  - key: /org/gnome/shell/extensions/dash-to-dock/height-fraction
    value: "{{ gnome_dash_to_dock_height_fraction }}"
  - key: /org/gnome/shell/extensions/dash-to-dock/apply-custom-theme
    value: "{{ gnome_dash_to_dock_apply_custom_theme | lower }}"
  - key: /org/gnome/shell/extensions/openbar/bradius
    value: "{{ gnome_openbar_border_radius }}"
  - key: /org/gnome/shell/extensions/openbar/bartype
    value: "'{{ gnome_openbar_bar_type }}'"
  - key: /org/gnome/shell/extensions/openbar/neon
    value: "{{ gnome_openbar_neon | lower }}"
  - key: /org/gnome/shell/extensions/openbar/bcolor
    value: "{{ gnome_openbar_border_color | string }}"
  - key: /org/gnome/shell/extensions/openbar/dark-bcolor
    value: "{{ gnome_openbar_border_color | string }}"
  - key: /org/gnome/shell/extensions/openbar/light-bcolor
    value: "{{ gnome_openbar_border_color | string }}"
  - key: /org/gnome/shell/extensions/spotify-controls/position
    value: "'{{ gnome_spotify_controls_indicator_position }}'"
  - key: /org/gnome/shell/extensions/workspace-indicator/embed-previews
    value: "{{ gnome_workspace_indicator_embed_previews | lower }}"
  - key: /org/gnome/shell/extensions/tilingshell/inner-gaps
    value: "uint32 {{ gnome_tilingshell_inner_gaps }}"
  - key: /org/gnome/shell/extensions/tilingshell/outer-gaps
    value: "uint32 {{ gnome_tilingshell_outer_gaps }}"
