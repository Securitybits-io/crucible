---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "GNOME installation only supports Debian targets."

- name: Install GNOME desktop packages
  ansible.builtin.apt:
    name: "{{ gnome_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure wallpaper directory exists
  ansible.builtin.file:
    path: "{{ gnome_wallpaper_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install workstation wallpaper
  ansible.builtin.copy:
    src: "{{ gnome_wallpaper_file }}"
    dest: "{{ gnome_wallpaper_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure system keyboard layout
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: "0644"

- name: Ensure dconf profile directory exists
  ansible.builtin.file:
    path: /etc/dconf/profile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure dconf profile
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    owner: root
    group: root
    mode: "0644"
    content: |
      user-db:user
      system-db:local
  notify: Update dconf database

- name: Ensure dconf defaults directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure GNOME desktop defaults
  ansible.builtin.template:
    src: desktop-defaults.ini.j2
    dest: /etc/dconf/db/local.d/00-crucible-desktop
    owner: root
    group: root
    mode: "0644"
  notify: Update dconf database

- name: Enable power profile service
  ansible.builtin.service:
    name: power-profiles-daemon
    enabled: true
    state: started

- name: Read current power profile
  ansible.builtin.command:
    cmd: powerprofilesctl get
  register: gnome_current_power_profile
  changed_when: false

- name: Set power profile
  ansible.builtin.command:
    cmd: "powerprofilesctl set {{ gnome_power_profile }}"
  when: gnome_current_power_profile.stdout != gnome_power_profile
  changed_when: true

- name: Enable GNOME display manager
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ gnome_services }}"
