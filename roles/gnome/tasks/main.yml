---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "GNOME installation only supports Debian targets."

- name: Install GNOME desktop packages
  ansible.builtin.apt:
    name: "{{ gnome_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove unwanted GNOME packages
  ansible.builtin.apt:
    name: "{{ gnome_debloat_packages }}"
    state: absent
    autoremove: true
    purge: true

- name: Ensure wallpaper directory exists
  ansible.builtin.file:
    path: "{{ gnome_wallpaper_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install workstation wallpaper
  ansible.builtin.copy:
    src: "{{ gnome_wallpaper_file }}"
    dest: "{{ gnome_wallpaper_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure AccountsService icon directory exists
  ansible.builtin.file:
    path: "{{ gnome_accountsservice_icon_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure AccountsService user directory exists
  ansible.builtin.file:
    path: "{{ gnome_accountsservice_user_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install GNOME profile pictures
  ansible.builtin.copy:
    src: "{{ gnome_profile_picture_file }}"
    dest: "{{ gnome_accountsservice_icon_directory }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ gnome_profile_picture_users }}"

- name: Configure GNOME profile picture paths
  community.general.ini_file:
    path: "{{ gnome_accountsservice_user_directory }}/{{ item }}"
    section: User
    option: Icon
    value: "{{ gnome_accountsservice_icon_directory }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    no_extra_spaces: true
    state: present
  loop: "{{ gnome_profile_picture_users }}"

- name: Install GNOME Shell extensions
  ansible.builtin.import_tasks: extensions.yml

- name: Apply GNOME desktop settings
  ansible.builtin.import_tasks: settings.yml

- name: Enable GNOME display manager
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ gnome_services }}"
