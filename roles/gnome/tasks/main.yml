---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "GNOME installation only supports Debian targets."

- name: Install GNOME desktop packages
  ansible.builtin.apt:
    name: "{{ gnome_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure wallpaper directory exists
  ansible.builtin.file:
    path: "{{ gnome_wallpaper_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install workstation wallpaper
  ansible.builtin.copy:
    src: "{{ gnome_wallpaper_file }}"
    dest: "{{ gnome_wallpaper_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Apply GNOME desktop settings
  ansible.builtin.import_tasks: settings.yml

- name: Enable GNOME display manager
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ gnome_services }}"
