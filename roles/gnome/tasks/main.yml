---
- name: Ensure target is Debian
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
    fail_msg: "GNOME installation only supports Debian targets."

- name: Install GNOME desktop packages
  ansible.builtin.apt:
    name: "{{ gnome_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable GNOME display manager
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ gnome_services }}"
